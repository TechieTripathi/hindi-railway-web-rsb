{% extends "_base.html" %}
{% block title %}How the scores are calculated{% endblock %}
{% block headerextra %}<span class="faint tiny mono">{{ source }}</span>{% endblock %}
{% block body %}
<style>
  .doc { max-width:920px; }
  .doc h1 { font-size:22px; margin:0 0 6px; }
  .doc h2 { font-size:17px; margin:30px 0 8px; padding-top:14px; border-top:1px solid var(--line); }
  .doc h3 { font-size:15px; margin:20px 0 6px; }
  .doc p { margin:9px 0; }
  .doc ul { margin:9px 0; padding-left:22px; }
  .doc li { margin:4px 0; }
  .doc table { border-collapse:collapse; margin:13px 0; font-size:13.5px; }
  .doc th, .doc td { border:1px solid var(--line); padding:7px 11px; text-align:left; vertical-align:top; }
  .doc th { background:var(--panel2); font-weight:600; }
  .doc pre { background:var(--panel2); border:1px solid var(--line); border-radius:7px;
             padding:11px 13px; font-size:13px; overflow-x:auto; margin:12px 0; }
  .doc code { background:var(--panel2); border-radius:4px; padding:1px 5px; font-size:13px; }
  .doc pre code { background:none; padding:0; }
  .doc blockquote { margin:12px 0; padding:10px 14px; border-left:3px solid var(--accent-line);
                    background:var(--panel2); border-radius:0 7px 7px 0; }
  .doc hr { border:0; border-top:1px solid var(--line); margin:26px 0; }
</style>
<article class="panel doc" style="padding:22px 26px">{{ body|safe }}</article>
{% endblock %}
